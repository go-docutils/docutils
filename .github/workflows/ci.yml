name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GOWORK: "off"

jobs:
  test:
    runs-on: ubuntu-latest
    # The race detector needs cgo at test time; the library itself stays
    # CGO-free, which the cross-build job proves with CGO_ENABLED=0.
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - name: Gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needs to be run on:"
            echo "$out"
            exit 1
          fi
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Test with coverage (race)
        # No hard percentage gate here, unlike some sibling repos: this
        # README documents per-package coverage as a number to keep an eye
        # on (doctree/rst/html/latex), not a threshold to enforce — the
        # same "reference point, not a gate" convention docutils itself
        # already uses in its own README.
        run: |
          go test -race -covermode=atomic -coverprofile=cover.out ./...
          go tool cover -func=cover.out

  cross-build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - linux/riscv64
          - linux/ppc64le
          - linux/s390x
          - linux/loong64
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
          - js/wasm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - name: Build ${{ matrix.target }}
        run: |
          export GOOS=$(echo "${{ matrix.target }}" | cut -d/ -f1)
          export GOARCH=$(echo "${{ matrix.target }}" | cut -d/ -f2)
          go build ./...
